version: '3.8'

services:
  # --- CACHE LAYER (Highly recommended for production metadata speed) ---
  registry-cache:
    image: redis:7-alpine
    container_name: registry-cache
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - registry-net

  # --- CORE REGISTRY ENGINE ---
  registry:
    image: registry:2
    container_name: docker-registry
    restart: always
    ports:
      - "127.0.0.1:5000:5000" # Route through Nginx/Cloudflare proxy with SSL on the host
    depends_on:
      - registry-cache
    extra_hosts:
      - "host.docker.internal:host-gateway" # Resolves the host machine's IP inside Linux Docker
    volumes:
      - ./config.yml:/etc/docker/registry/config.yml:ro
      - ./auth:/etc/docker/registry/auth:ro
      - registry-blobs:/var/lib/registry
    networks:
      - registry-net

volumes:
  registry-blobs:
    driver: local

networks:
  registry-net:
    driver: bridge